<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stillwords · Today (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Figtree:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#F7F3EC}
a{color:#8A6A30}a:hover{color:#6E5426}
.sc-mtn{background:linear-gradient(180deg,#1e2230 0%,#3a3846 38%,#86675a 60%,#c8936a 68%,#e2b77f 71%,#2a2326 72%)}
.ridge-a{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(180deg,#4b3f43,#2a2326);clip-path:polygon(0 38%,14% 18%,27% 34%,44% 6%,60% 30%,76% 12%,90% 26%,100% 16%,100% 100%,0 100%)}
.ridge-b{position:absolute;left:0;right:0;bottom:0;height:28%;background:#161210;clip-path:polygon(0 30%,20% 8%,38% 40%,58% 14%,80% 38%,100% 20%,100% 100%,0 100%)}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,14,12,.35) 0%,rgba(15,14,12,.05) 35%,rgba(15,14,12,.55) 70%,rgba(15,14,12,.92) 100%)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn-ghost{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:#F3EDE3;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F7F3EC;color:#1C1A17;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden">

  <header style="padding:52px 20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8A6A30;font-weight:500">No. 292 · Monday, 19 October</span>
      <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;letter-spacing:-0.3px">Good evening</h1>
    </div>
    <div style="display:flex;gap:4px">
      <button class="btn-ghost" aria-label="Search" style="color:#6B645A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg></button>
      <button class="btn-ghost" aria-label="Settings" style="color:#6B645A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
    </div>
  </header>

  <main style="flex:1;display:flex;flex-direction:column;gap:20px;padding:0 20px;overflow:hidden">

    <article style="position:relative;height:440px;border-radius:28px;overflow:hidden;flex-shrink:0" class="sc-mtn">
      <div class="ridge-a"></div><div class="ridge-b"></div><div class="scrim"></div>
      <div style="position:absolute;inset:0;padding:22px 24px 18px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#E8D3A8;font-weight:500">Quote of the day · Courage</span>
          <span style="font-size:11px;color:rgba(243,237,227,.6)">Photo · Pexels</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <p style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:27px;line-height:1.28;color:#F3EDE3;text-wrap:balance">Courage is not loud. Some days it is simply getting up and trying again.</p>
          <span style="font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:15px;color:rgba(243,237,227,.72)">— Stillwords</span>
          <div style="display:flex;gap:2px;margin-left:-11px;margin-top:4px">
            <button class="btn-ghost" aria-label="Save to favourites"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
            <button class="btn-ghost" aria-label="Share"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></button>
            <button class="btn-ghost" aria-label="Download image"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
            <button class="btn-ghost" aria-label="Edit design"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"></path></svg></button>
          </div>
        </div>
      </div>
    </article>

    <section style="border:1px solid #DCD3C4;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#EFE9DF">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-family:'Newsreader',Georgia,serif;font-size:18px">5 quiet days</span>
        <span style="font-size:12px;color:#6B645A">Your week of stillness</span>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <span style="{{d.dot}}"></span>
            <span style="font-size:10px;color:#6B645A">{{d.label}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:20px">For this moment</h2>
      <div style="display:flex;gap:8px;overflow:hidden">
        <button style="flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid #8A6A30;background:rgba(200,164,106,.12);color:#6E5426;font:500 13px 'Figtree',sans-serif">Calm</button>
        <button style="flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid #DCD3C4;background:transparent;color:#1C1A17;font:500 13px 'Figtree',sans-serif">Focused</button>
        <button style="flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid #DCD3C4;background:transparent;color:#1C1A17;font:500 13px 'Figtree',sans-serif">Hopeful</button>
        <button style="flex-shrink:0;height:40px;padding:0 16px;border-radius:999px;border:1px solid #DCD3C4;background:transparent;color:#1C1A17;font:500 13px 'Figtree',sans-serif">Need a lift</button>
      </div>
    </section>
  </main>

  <nav aria-label="Main" style="height:76px;border-top:1px solid #DCD3C4;background:#F7F3EC;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:8px 8px 14px;box-sizing:border-box">
    <a href="MainLight.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#8A6A30;font-size:11px;font-weight:600"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today</a>
    <a href="ExploreLight.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#6B645A;font-size:11px;font-weight:500"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Explore</a>
    <a href="Designer.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#6B645A;font-size:11px;font-weight:500"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M12 8v8M8 12h8"></path></svg>Create</a>
    <a href="SavedLight.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#6B645A;font-size:11px;font-weight:500"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-4-5 4z"></path></svg>Saved</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"daysDone":{"editor":"int","default":5,"min":0,"max":7},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = this.props.daysDone ?? 5;
    const labels = ['M','T','W','T','F','S','S'];
    const week = labels.map((l, i) => ({
      label: l,
      dot: i < done
        ? 'display:block;width:10px;height:10px;border-radius:50%;background:#8A6A30'
        : 'display:block;width:10px;height:10px;border-radius:50%;border:1px solid #C9BFAE;box-sizing:border-box'
    }));
    return { week };
  }
}
</script>
</body>
</html>
