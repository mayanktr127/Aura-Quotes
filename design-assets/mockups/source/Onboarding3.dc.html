<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stillwords · Daily reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Figtree:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#0F0E0C}
a{color:#C8A46A}a:hover{color:#E0C08A}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dawn{background:radial-gradient(circle at 50% 100%,#f1cf92 0,#d79a5c 18%,rgba(160,100,70,.4) 38%,transparent 60%),linear-gradient(180deg,#0F0E0C 0%,#1c1a22 40%,#4a3a3a 100%)}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0F0E0C;color:#F3EDE3;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;padding:44px 0 34px;overflow:hidden">

  <header style="display:flex;justify-content:space-between;align-items:center;padding:0 12px 0 8px">
    <a href="Onboarding2.dc.html" aria-label="Back" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#F3EDE3"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display:flex;gap:6px" aria-label="Step 3 of 3">
      <span style="width:8px;height:4px;border-radius:2px;background:#4A443D"></span>
      <span style="width:8px;height:4px;border-radius:2px;background:#4A443D"></span>
      <span style="width:22px;height:4px;border-radius:2px;background:#C8A46A"></span>
    </div>
    <span style="width:44px"></span>
  </header>

  <div style="padding:20px 24px 0;display:flex;flex-direction:column;gap:10px">
    <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#C8A46A;font-weight:500">Step 3 of 3</span>
    <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:32px;line-height:1.15;letter-spacing:-0.3px">When should today's quote find you?</h1>
    <p style="margin:0;font-size:14px;line-height:1.5;color:#A69F94">One quiet notification a day. Change or turn it off anytime in Settings.</p>
  </div>

  <div class="dawn" style="margin:24px 24px 0;height:150px;border-radius:24px;border:1px solid #2E2A26;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
    <span style="font-family:'Newsreader',Georgia,serif;font-size:52px;letter-spacing:-1px;line-height:1">{{time}}</span>
    <span style="font-size:13px;color:rgba(243,237,227,.7)">{{slotName}}</span>
  </div>

  <div role="radiogroup" aria-label="Reminder time" style="padding:16px 24px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
      <button role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}"><span style="font-size:14px;font-weight:500">{{s.name}}</span><span style="font-size:12px;opacity:.75">{{s.time}}</span></button>
    </sc-for>
  </div>

  <div style="flex:1"></div>

  <div style="padding:0 24px;display:flex;flex-direction:column;gap:6px">
    <a href="Main.dc.html" style="height:56px;border-radius:16px;background:#C8A46A;color:#0F0E0C;font:600 16px 'Figtree',sans-serif;display:flex;align-items:center;justify-content:center;text-decoration:none">Turn on reminder</a>
    <a href="Main.dc.html" style="height:48px;display:flex;align-items:center;justify-content:center;color:#A69F94;font-size:14px;text-decoration:none">Not now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { i: 1 }; }
  renderVals() {
    const list = [
      { name: 'Early morning', time: '6:30 AM' },
      { name: 'Morning', time: '7:30 AM' },
      { name: 'Lunch break', time: '1:00 PM' },
      { name: 'Before sleep', time: '10:00 PM' }
    ];
    const cur = this.state.i;
    const slots = list.map((s, idx) => {
      const on = idx === cur;
      return {
        name: s.name, time: s.time,
        on: on ? 'true' : 'false',
        pick: () => this.setState({ i: idx }),
        style: 'height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 16px;cursor:pointer;font-family:Figtree,sans-serif;' + (on
          ? 'border:1px solid #C8A46A;background:rgba(200,164,106,.12);color:#E8D3A8'
          : 'border:1px solid #2E2A26;background:#1A1816;color:#F3EDE3')
      };
    });
    return { slots, time: list[cur].time, slotName: list[cur].name };
  }
}
</script>
</body>
</html>
